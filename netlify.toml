[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22.13.0"

# scripts/netlify-seo.mjs generates public/_redirects and public/_headers during
# prebuild, using Netlify syntax when NETLIFY=true. Vinext copies both to
# dist/client. Cloudflare uses Worker redirects instead; keep cache headers below.
# Missing static routes use the exported 404.html (HTTP 404), without a 200 rewrite.

[build.processing]
  skip_processing = true

# Source assets inherit these browser-cache headers when transformed by Netlify Image CDN.
[[headers]]
  for = "/project-previews/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"
